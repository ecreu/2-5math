<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f7f8fa"
  >

  <title>미적분 개념 테스트</title>

  <style>
    /* =====================================================
       기본 설정
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f8fa;
      --card: #ffffff;

      --text: #17191c;
      --sub: #73777d;

      --border: #e7e9ed;

      --accent: #4f6df5;
      --accent-light: #eef1ff;

      --green: #2e9b62;
      --green-light: #eaf8f0;

      --red: #d95b5b;
      --red-light: #fff0f0;

      --progress-bg: #e7e9ed;
      --answer-bg: #fafbfc;
      --definition-bg: #f7f8fa;
      --back-active: #eceef1;

      --shadow:
        0 4px 18px rgba(0, 0, 0, 0.05);

      --radius: 18px;
    }


    /* =====================================================
       다크 모드
    ===================================================== */

    @media (prefers-color-scheme: dark) {

      :root {
        --bg: #101114;
        --card: #181a1f;

        --text: #f1f3f5;
        --sub: #9a9fa8;

        --border: #2a2d33;

        --accent: #7188ff;
        --accent-light: #20284a;

        --green: #54c889;
        --green-light: #183326;

        --red: #ef7777;
        --red-light: #351d1f;

        --progress-bg: #2a2d33;
        --answer-bg: #1d2025;
        --definition-bg: #202328;
        --back-active: #292c32;

        --shadow:
          0 4px 18px rgba(0, 0, 0, 0.22);
      }

      meta[name="theme-color"] {
        color: #101114;
      }
    }


    /* =====================================================
       전체
    ===================================================== */

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;

      transition:
        background-color 0.2s ease,
        color 0.2s ease;
    }

    body {
      min-height: 100vh;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      appearance: none;
      -webkit-appearance: none;

      font: inherit;

      color: inherit;
    }

    button:focus-visible {
      outline:
        3px solid rgba(79, 109, 245, 0.25);

      outline-offset: 2px;
    }

    .hidden {
      display: none !important;
    }


    /* =====================================================
       공통
    ===================================================== */

    .page {
      width: 100%;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 760px;

      margin: 0 auto;

      padding-left: 20px;
      padding-right: 20px;
    }


    /* =====================================================
       메인 헤더
    ===================================================== */

    .header {
      padding-top:
        max(32px, env(safe-area-inset-top));

      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: 24px;
    }

    .header-inner {
      width: 100%;
      max-width: 760px;

      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 8px;

      color: var(--accent);

      font-size: 13px;
      font-weight: 750;

      letter-spacing: 0.03em;
    }

    .main-title {
      margin: 0;

      font-size:
        clamp(28px, 8vw, 40px);

      line-height: 1.2;

      letter-spacing: -0.045em;
    }

    .description {
      margin: 12px 0 0;

      color: var(--sub);

      font-size: 15px;
      line-height: 1.6;

      word-break: keep-all;
    }

    main {
      padding-bottom: 40px;
    }


    /* =====================================================
       단원 선택
    ===================================================== */

    .section-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin: 12px 0;
    }

    .section-title {
      margin: 0;

      font-size: 18px;
      font-weight: 750;

      letter-spacing: -0.03em;
    }

    .chapter-count {
      color: var(--sub);

      font-size: 13px;
    }

    .chapter-list {
      display: flex;

      flex-direction: column;

      gap: 12px;
    }

    .chapter-card {
      width: 100%;

      padding: 20px;

      border:
        1px solid var(--border);

      border-radius: var(--radius);

      background: var(--card);

      box-shadow: var(--shadow);

      color: var(--text);

      text-align: left;

      cursor: pointer;

      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background-color 0.2s ease;
    }

    .chapter-card:active {
      transform: scale(0.985);

      box-shadow: none;
    }

    .chapter-top {
      display: flex;

      align-items: center;
      justify-content: space-between;
    }

    .chapter-number {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 28px;

      padding: 0 10px;

      border-radius: 8px;

      background: var(--accent-light);

      color: var(--accent);

      font-size: 12px;
      font-weight: 750;
    }

    .arrow {
      color: #a2a6ac;

      font-size: 20px;
    }

    .chapter-title {
      margin:
        15px 0 6px;

      font-size: 19px;

      line-height: 1.35;

      letter-spacing: -0.035em;
    }

    .chapter-description {
      margin: 0;

      color: var(--sub);

      font-size: 14px;

      line-height: 1.55;

      word-break: keep-all;
    }

    .chapter-progress {
      margin-top: 15px;

      color: var(--sub);

      font-size: 12px;
    }


    /* =====================================================
       서브 헤더
    ===================================================== */

    .sub-header {
      display: flex;

      align-items: center;

      gap: 8px;

      padding-top:
        max(16px, env(safe-area-inset-top));

      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: 12px;
    }

    .back-button {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 40px;
      height: 40px;

      padding: 0;

      border: 0;
      border-radius: 12px;

      background: transparent;

      color: var(--text);

      font-size: 22px;

      cursor: pointer;
    }

    .back-button:active {
      background: var(--back-active);
    }

    .sub-title {
      margin: 0;

      font-size: 18px;
      font-weight: 750;

      letter-spacing: -0.035em;
    }


    /* =====================================================
       학습 방법
    ===================================================== */

    .mode-content {
      padding-top: 18px;
    }

    .mode-intro {
      margin-bottom: 22px;
    }

    .mode-chapter {
      margin: 0 0 7px;

      color: var(--accent);

      font-size: 13px;
      font-weight: 750;
    }

    .mode-heading {
      margin: 0;

      font-size: 27px;

      line-height: 1.3;

      letter-spacing: -0.045em;
    }

    .mode-description {
      margin: 10px 0 0;

      color: var(--sub);

      font-size: 14px;

      line-height: 1.55;
    }

    .mode-list {
      display: flex;

      flex-direction: column;

      gap: 12px;
    }

    .mode-button {
      display: flex;

      align-items: center;

      width: 100%;

      padding: 20px;

      border:
        1px solid var(--border);

      border-radius: var(--radius);

      background: var(--card);

      box-shadow: var(--shadow);

      color: var(--text);

      text-align: left;

      cursor: pointer;

      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background-color 0.2s ease;
    }

    .mode-button:active {
      transform: scale(0.985);

      box-shadow: none;
    }

    .mode-icon {
      display: flex;

      align-items: center;
      justify-content: center;

      flex: 0 0 48px;

      width: 48px;
      height: 48px;

      margin-right: 16px;

      border-radius: 14px;

      background: var(--accent-light);

      color: var(--accent);

      font-size: 21px;
      font-weight: 800;
    }

    .mode-text {
      flex: 1;

      min-width: 0;

      display: flex;

      flex-direction: column;

      align-items: flex-start;

      gap: 5px;
    }

    .mode-title {
      display: block;

      margin: 0;

      font-size: 17px;
      font-weight: 750;

      line-height: 1.3;

      letter-spacing: -0.03em;
    }

    .mode-detail {
      display: block;

      margin: 0;

      color: var(--sub);

      font-size: 13px;

      line-height: 1.45;

      word-break: keep-all;
    }

    .mode-arrow {
      flex: 0 0 auto;

      margin-left: 10px;

      color: #a2a6ac;

      font-size: 19px;
    }

    .mode-button.disabled {
      opacity: 0.55;
    }


    /* =====================================================
       암기 화면
    ===================================================== */

    .memorize-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding-top:
        max(16px, env(safe-area-inset-top));

      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: 12px;
    }

    .memorize-count {
      color: var(--sub);

      font-size: 13px;
      font-weight: 650;
    }

    .memorize-content {
      padding-top: 14px;
    }

    .progress-area {
      margin-bottom: 18px;
    }

    .progress-info {
      display: flex;

      justify-content: space-between;

      margin-bottom: 8px;

      color: var(--sub);

      font-size: 12px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;

      overflow: hidden;

      border-radius: 999px;

      background: var(--progress-bg);
    }

    .progress-fill {
      width: 0;
      height: 100%;

      border-radius: inherit;

      background: var(--accent);

      transition: width 0.25s ease;
    }

    .flashcard {
      width: 100%;

      min-height: 360px;

      padding: 30px 22px;

      border:
        1px solid var(--border);

      border-radius: 24px;

      background: var(--card);

      box-shadow: var(--shadow);

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;
    }

    .card-label {
      margin-bottom: 16px;

      color: var(--sub);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 0.04em;
    }

    .concept-name {
      margin: 0;

      font-size:
        clamp(26px, 7vw, 34px);

      line-height: 1.3;

      letter-spacing: -0.045em;

      word-break: keep-all;
    }

    .answer-area {
      width: 100%;

      margin-top: 28px;
    }

    .reveal-button {
      width: 100%;

      min-height: 58px;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background: var(--answer-bg);

      color: var(--text);

      font-size: 15px;
      font-weight: 650;

      cursor: pointer;
    }

    .definition {
      display: none;

      width: 100%;

      padding: 18px;

      border-radius: 14px;

      background: var(--definition-bg);

      color: var(--text);

      font-size: 15px;

      line-height: 1.7;

      text-align: left;

      word-break: keep-all;
    }

    .definition.visible {
      display: block;
    }

    .result-buttons {
      display: none;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      width: 100%;

      margin-top: 12px;
    }

    .result-buttons.visible {
      display: grid;
    }

    .result-button {
      min-height: 56px;

      border-radius: 14px;

      font-size: 14px;
      font-weight: 750;

      cursor: pointer;
    }

    .again-button {
      border:
        1px solid #f0caca;

      background: var(--red-light);

      color: var(--red);
    }

    .done-button {
      border:
        1px solid #bfe6cf;

      background: var(--green-light);

      color: var(--green);
    }

    .memorize-hint {
      margin: 16px 0 0;

      color: var(--sub);

      font-size: 12px;

      line-height: 1.5;

      text-align: center;
    }


    /* =====================================================
       완료 화면
    ===================================================== */

    .complete {
      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding: 30px 20px;

      text-align: center;
    }

    .complete-icon {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 72px;
      height: 72px;

      margin-bottom: 20px;

      border-radius: 50%;

      background: var(--green-light);

      color: var(--green);

      font-size: 34px;
      font-weight: 800;
    }

    .complete-title {
      margin: 0;

      font-size: 28px;

      letter-spacing: -0.045em;
    }

    .complete-description {
      margin:
        10px 0 24px;

      color: var(--sub);

      font-size: 14px;

      line-height: 1.6;
    }

    .complete-button {
      width: 100%;

      max-width: 360px;

      min-height: 56px;

      border: 0;

      border-radius: 14px;

      background: var(--accent);

      color: white;

      font-size: 15px;
      font-weight: 750;

      cursor: pointer;
    }


    /* =====================================================
       PC
    ===================================================== */

    @media (min-width: 768px) {

      .header {
        padding-top: 64px;
        padding-bottom: 32px;
      }

      .chapter-list {
        display: grid;

        grid-template-columns:
          repeat(2, 1fr);
      }

      .chapter-card {
        min-height: 210px;
      }

      .memorize-content {
        max-width: 650px;

        margin-left: auto;
        margin-right: auto;
      }

      .flashcard {
        min-height: 400px;
      }
    }
  </style>
</head>


<body>

  <div id="app">


    <!-- ===================================================
         홈
    ==================================================== -->

    <section
      id="homePage"
      class="page"
    >

      <header class="header">

        <div class="header-inner">

          <p class="eyebrow">
            MATHEMATICS · CALCULUS I
          </p>

          <h1 class="main-title">
            미적분 개념 테스트
          </h1>

          <p class="description">
            미적분Ⅰ의 핵심 개념을<br>
            단원별로 공부하고 확인해보세요.
          </p>

        </div>

      </header>


      <main>

        <div class="container">

          <div class="section-header">

            <h2 class="section-title">
              단원 선택
            </h2>

            <span
              id="chapterCount"
              class="chapter-count"
            ></span>

          </div>


          <section
            id="chapterList"
            class="chapter-list"
          ></section>

        </div>

      </main>

    </section>


    <!-- ===================================================
         학습 방법
    ==================================================== -->

    <section
      id="modePage"
      class="page hidden"
    >

      <header class="sub-header">

        <button
          id="modeBackButton"
          class="back-button"
          type="button"
          aria-label="뒤로가기"
        >
          ←
        </button>

        <h2 class="sub-title">
          학습 방법
        </h2>

      </header>


      <main>

        <div class="container mode-content">

          <div class="mode-intro">

            <p
              id="modeChapter"
              class="mode-chapter"
            ></p>

            <h1
              id="modeHeading"
              class="mode-heading"
            ></h1>

            <p
              id="modeDescription"
              class="mode-description"
            ></p>

          </div>


          <div class="mode-list">

            <button
              id="memorizeButton"
              class="mode-button"
              type="button"
            >

              <span class="mode-icon">
                A
              </span>

              <span class="mode-text">

                <span class="mode-title">
                  암기하기
                </span>

                <span class="mode-detail">
                  주요 개념을 카드 형태로 학습합니다.
                </span>

              </span>

              <span class="mode-arrow">
                →
              </span>

            </button>


            <button
              id="quizButton"
              class="mode-button disabled"
              type="button"
            >

              <span class="mode-icon">
                ?
              </span>

              <span class="mode-text">

                <span class="mode-title">
                  문제 풀기
                </span>

                <span class="mode-detail">
                  개념을 바탕으로 문제를 풀어봅니다.
                </span>

              </span>

              <span class="mode-arrow">
                →
              </span>

            </button>

          </div>

        </div>

      </main>

    </section>


    <!-- ===================================================
         암기
    ==================================================== -->

    <section
      id="memorizePage"
      class="page hidden"
    >

      <header class="memorize-header">

        <button
          id="memorizeBackButton"
          class="back-button"
          type="button"
          aria-label="뒤로가기"
        >
          ←
        </button>

        <span
          id="memorizeCount"
          class="memorize-count"
        >
          1 / 1
        </span>

      </header>


      <main>

        <div class="container memorize-content">

          <div class="progress-area">

            <div class="progress-info">

              <span>
                학습 진행률
              </span>

              <span id="progressPercent">
                0%
              </span>

            </div>


            <div class="progress-bar">

              <div
                id="progressFill"
                class="progress-fill"
              ></div>

            </div>

          </div>


          <div class="flashcard">

            <span class="card-label">
              핵심 개념
            </span>


            <h2
              id="conceptName"
              class="concept-name"
            ></h2>


            <div class="answer-area">

              <button
                id="revealButton"
                class="reveal-button"
                type="button"
              >
                뜻 확인하기
              </button>


              <div
                id="definition"
                class="definition"
              ></div>


              <div
                id="resultButtons"
                class="result-buttons"
              >

                <button
                  id="againButton"
                  class="result-button again-button"
                  type="button"
                >
                  다시 학습
                </button>

                <button
                  id="doneButton"
                  class="result-button done-button"
                  type="button"
                >
                  암기 완료
                </button>

              </div>

            </div>

          </div>


          <p class="memorize-hint">
            먼저 개념의 뜻을 떠올린 뒤<br>
            뜻을 확인하고 학습 여부를 선택하세요.
          </p>

        </div>

      </main>

    </section>


    <!-- ===================================================
         완료
    ==================================================== -->

    <section
      id="completePage"
      class="page hidden"
    >

      <div class="complete">

        <div class="complete-icon">
          ✓
        </div>

        <h1 class="complete-title">
          암기 완료!
        </h1>

        <p class="complete-description">
          이 단원의 모든 개념을<br>
          암기 완료로 표시했습니다.
        </p>

        <button
          id="completeBackButton"
          class="complete-button"
          type="button"
        >
          학습 방법으로 돌아가기
        </button>

      </div>

    </section>

  </div>


  <script>
    "use strict";


    /* =====================================================
       데이터
    ===================================================== */

    const chapters = [
      {
        id: 1,

        title: "함수의 극한과 연속",

        description:
          "함수의 극한과 연속에 관한 핵심 개념을 학습합니다.",

        concepts: [
          {
            id: 101,
            name: "함수의 극한",
            definition:
              "x가 어떤 수 a에 한없이 가까워질 때 f(x)의 값이 일정한 값 L에 한없이 가까워진다면, L을 x가 a에 가까워질 때의 함수 f(x)의 극한값이라고 한다."
          },

          {
            id: 102,
            name: "좌극한",
            definition:
              "x가 a보다 작은 쪽에서 a에 한없이 가까워질 때 f(x)가 가까워지는 값을 x가 a로 접근할 때의 좌극한이라고 한다."
          },

          {
            id: 103,
            name: "우극한",
            definition:
              "x가 a보다 큰 쪽에서 a에 한없이 가까워질 때 f(x)가 가까워지는 값을 x가 a로 접근할 때의 우극한이라고 한다."
          },

          {
            id: 104,
            name: "극한값의 존재",
            definition:
              "x가 a에 가까워질 때의 좌극한과 우극한이 서로 같을 때 함수의 극한값이 존재한다고 한다."
          },

          {
            id: 105,
            name: "함수의 연속",
            definition:
              "함수 f(x)가 x=a에서 정의되어 있고, x가 a에 가까워질 때의 극한값이 존재하며 그 값이 f(a)와 같으면 f(x)는 x=a에서 연속이라고 한다."
          },

          {
            id: 106,
            name: "연속함수",
            definition:
              "정의역의 모든 점에서 연속인 함수를 연속함수라고 한다."
          },

          {
            id: 107,
            name: "중간값의 정리",
            definition:

    /* =====================================================
       앱 상태
    ===================================================== */

    const state = {
      currentPage: "home",

      selectedChapterId: null,

      remainingCards: [],

      currentCardId: null,

      completedCardIds: new Set(),

      revealed: false
    };


    /* =====================================================
       DOM
    ===================================================== */

    const $ = (id) => {
      return document.getElementById(id);
    };


    const pages = {
      home: $("homePage"),
      mode: $("modePage"),
      memorize: $("memorizePage"),
      complete: $("completePage")
    };


    const chapterList = $("chapterList");
    const chapterCount = $("chapterCount");

    const modeChapter = $("modeChapter");
    const modeHeading = $("modeHeading");
    const modeDescription = $("modeDescription");

    const conceptName = $("conceptName");
    const definition = $("definition");

    const revealButton = $("revealButton");

    const resultButtons = $("resultButtons");

    const againButton = $("againButton");
    const doneButton = $("doneButton");

    const memorizeCount = $("memorizeCount");

    const progressPercent = $("progressPercent");
    const progressFill = $("progressFill");


    /* =====================================================
       현재 선택된 단원
    ===================================================== */

    function getSelectedChapter() {

      if (state.selectedChapterId === null) {
        return null;
      }

      return chapters.find(
        (chapter) =>
          chapter.id === state.selectedChapterId
      ) || null;
    }


    /* =====================================================
       페이지 전환
    ===================================================== */

    function showPage(pageName) {

      if (!pages[pageName]) {
        return;
      }

      Object.keys(pages).forEach(
        (key) => {

          pages[key].classList.toggle(
            "hidden",
            key !== pageName
          );

        }
      );

      state.currentPage = pageName;

      window.scrollTo(
        0,
        0
      );
    }


    /* =====================================================
       단원 목록
    ===================================================== */

    function renderChapters() {

      chapterList.replaceChildren();

      chapterCount.textContent =
        `${chapters.length}개 단원`;

      chapters.forEach(
        (chapter) => {

          const button =
            document.createElement("button");

          button.type = "button";

          button.className =
            "chapter-card";


          const top =
            document.createElement("div");

          top.className =
            "chapter-top";


          const number =
            document.createElement("span");

          number.className =
            "chapter-number";

          number.textContent =
            `CHAPTER ${String(chapter.id).padStart(2, "0")}`;


          const arrow =
            document.createElement("span");

          arrow.className =
            "arrow";

          arrow.textContent =
            "→";


          top.appendChild(number);
          top.appendChild(arrow);


          const title =
            document.createElement("h3");

          title.className =
            "chapter-title";

          title.textContent =
            chapter.title;


          const description =
            document.createElement("p");

          description.className =
            "chapter-description";

          description.textContent =
            chapter.description;


          const progress =
            document.createElement("div");

          progress.className =
            "chapter-progress";

          progress.textContent =
            `개념 ${chapter.concepts.length}개`;


          button.appendChild(top);
          button.appendChild(title);
          button.appendChild(description);
          button.appendChild(progress);


          button.addEventListener(
            "click",
            () => {

              openChapter(
                chapter.id
              );

            }
          );


          chapterList.appendChild(button);
        }
      );
    }


    /* =====================================================
       단원 열기
    ===================================================== */

    function openChapter(chapterId) {

      const chapter =
        chapters.find(
          (item) =>
            item.id === chapterId
        );


      if (!chapter) {
        return;
      }


      state.selectedChapterId =
        chapter.id;


      modeChapter.textContent =
        `CHAPTER ${String(chapter.id).padStart(2, "0")}`;


      modeHeading.textContent =
        chapter.title;


      modeDescription.textContent =
        chapter.description;


      showPage("mode");
    }


    /* =====================================================
       암기 시작
    ===================================================== */

    function startMemorize() {

      const chapter =
        getSelectedChapter();


      if (!chapter) {
        return;
      }


      if (
        !Array.isArray(chapter.concepts) ||
        chapter.concepts.length === 0
      ) {

        alert(
          "이 단원에는 학습할 개념이 없습니다."
        );

        return;
      }


      state.remainingCards =
        chapter.concepts.map(
          (card) => ({
            ...card
          })
        );


      state.completedCardIds =
        new Set();


      state.currentCardId =
        null;


      state.revealed =
        false;


      showPage("memorize");


      renderCurrentCard();
    }


    /* =====================================================
       현재 카드
    ===================================================== */

    function getCurrentCard() {

      if (
        state.currentCardId === null
      ) {
        return null;
      }


      return state.remainingCards.find(
        (card) =>
          card.id === state.currentCardId
      ) || null;
    }


    /* =====================================================
       카드 표시
    ===================================================== */

    function renderCurrentCard() {

      if (
        state.remainingCards.length === 0
      ) {

        showComplete();

        return;
      }


      let card =
        getCurrentCard();


      if (!card) {

        card =
          state.remainingCards[0];

        state.currentCardId =
          card.id;
      }


      state.revealed =
        false;


      conceptName.textContent =
        card.name;


      definition.replaceChildren();


      const strong =
        document.createElement("strong");

      strong.textContent =
        card.name;


      const br1 =
        document.createElement("br");

      const br2 =
        document.createElement("br");


      const text =
        document.createTextNode(
          card.definition
        );


      definition.appendChild(strong);
      definition.appendChild(br1);
      definition.appendChild(br2);
      definition.appendChild(text);


      definition.classList.remove(
        "visible"
      );


      resultButtons.classList.remove(
        "visible"
      );


      revealButton.classList.remove(
        "hidden"
      );


      revealButton.textContent =
        "뜻 확인하기";


      updateProgress();
    }


    /* =====================================================
       뜻 보기
    ===================================================== */

    function revealAnswer() {

      if (state.revealed) {
        return;
      }


      if (!getCurrentCard()) {
        return;
      }


      state.revealed =
        true;


      definition.classList.add(
        "visible"
      );


      resultButtons.classList.add(
        "visible"
      );


      revealButton.classList.add(
        "hidden"
      );
    }


    /* =====================================================
       다시 학습
    ===================================================== */

    function studyAgain() {

      if (!state.revealed) {
        return;
      }


      const index =
        state.remainingCards.findIndex(
          (card) =>
            card.id === state.currentCardId
        );


      if (index === -1) {
        return;
      }


      const [
        card
      ] =
        state.remainingCards.splice(
          index,
          1
        );


      state.remainingCards.push(card);


      state.currentCardId =
        state.remainingCards[0].id;


      renderCurrentCard();
    }


    /* =====================================================
       암기 완료
    ===================================================== */

    function markComplete() {

      if (!state.revealed) {
        return;
      }


      const currentId =
        state.currentCardId;


      if (currentId === null) {
        return;
      }


      const index =
        state.remainingCards.findIndex(
          (card) =>
            card.id === currentId
        );


      if (index === -1) {
        return;
      }


      state.completedCardIds.add(
        currentId
      );


      state.remainingCards.splice(
        index,
        1
      );


      if (
        state.remainingCards.length === 0
      ) {

        state.currentCardId =
          null;

        showComplete();

        return;
      }


      state.currentCardId =
        state.remainingCards[0].id;


      renderCurrentCard();
    }


    /* =====================================================
       진행률
    ===================================================== */

    function updateProgress() {

      const chapter =
        getSelectedChapter();


      if (!chapter) {
        return;
      }


      const total =
        chapter.concepts.length;


      const completed =
        state.completedCardIds.size;


      const percent =
        total > 0
          ? Math.round(
              (completed / total) * 100
            )
          : 0;


      progressPercent.textContent =
        `${percent}%`;


      progressFill.style.width =
        `${percent}%`;


      const currentNumber =
        Math.min(
          completed + 1,
          total
        );


      memorizeCount.textContent =
        `${currentNumber} / ${total}`;
    }


    /* =====================================================
       완료 화면
    ===================================================== */

    function showComplete() {

      progressPercent.textContent =
        "100%";


      progressFill.style.width =
        "100%";


      showPage("complete");
    }


    /* =====================================================
       홈
    ===================================================== */

    function goHome() {

      resetMemorizeState();

      state.selectedChapterId =
        null;

      showPage("home");
    }


    /* =====================================================
       학습 방법
    ===================================================== */

    function goMode() {

      resetMemorizeState();

      const chapter =
        getSelectedChapter();


      if (!chapter) {

        showPage("home");

        return;
      }


      modeChapter.textContent =
        `CHAPTER ${String(chapter.id).padStart(2, "0")}`;


      modeHeading.textContent =
        chapter.title;


      modeDescription.textContent =
        chapter.description;


      showPage("mode");
    }


    /* =====================================================
       암기 상태 초기화
    ===================================================== */

    function resetMemorizeState() {

      state.remainingCards =
        [];

      state.currentCardId =
        null;

      state.completedCardIds =
        new Set();

      state.revealed =
        false;
    }


    /* =====================================================
       이벤트
    ===================================================== */

    $("modeBackButton")
      .addEventListener(
        "click",
        goHome
      );


    $("memorizeBackButton")
      .addEventListener(
        "click",
        goMode
      );


    $("completeBackButton")
      .addEventListener(
        "click",
        goMode
      );


    $("memorizeButton")
      .addEventListener(
        "click",
        startMemorize
      );


    revealButton
      .addEventListener(
        "click",
        revealAnswer
      );


    againButton
      .addEventListener(
        "click",
        studyAgain
      );


    doneButton
      .addEventListener(
        "click",
        markComplete
      );


    $("quizButton")
      .addEventListener(
        "click",
        () => {

          alert(
            "문제 풀기 기능은 다음 단계에서 추가할 예정입니다."
          );

        }
      );


    /* =====================================================
       초기 실행
    ===================================================== */

    function init() {

      renderChapters();

      showPage("home");
    }


    init();

  </script>

</body>
</html>
